[project]
name = "docqa-operator"
version = "0.1.0"
description = "Kopf operator that turns DocQAService resources into Helm releases"
requires-python = ">=3.11"
dependencies = ["kopf>=1.37", "kubernetes>=30.1"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docqa_operator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
