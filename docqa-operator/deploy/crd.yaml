apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: docqaservices.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    kind: DocQAService
    plural: docqaservices
    singular: docqaservice
    shortNames: [docqa]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Team, type: string, jsonPath: .spec.team}
        - {name: Env, type: string, jsonPath: .spec.environment}
        - {name: Provider, type: string, jsonPath: .spec.llm.provider}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              description: What a consuming team asks for. The platform decides how it is built.
              required: [team, llm]
              x-kubernetes-validations:
                - rule: "self.llm.provider == 'fake' || has(self.llm.credentials)"
                  message: "llm.credentials is required for real LLM providers"
                - rule: "self.environment != 'prod' || self.llm.provider != 'fake'"
                  message: "the fake LLM is not allowed in prod"
                - rule: "!has(self.replicas) || self.replicas.max >= self.replicas.min"
                  message: "replicas.max must be >= replicas.min"
              properties:
                team:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{1,30}$"
                environment:
                  type: string
                  enum: [dev, prod]
                  default: dev
                size:
                  type: string
                  description: T-shirt size; maps to CPU and memory.
                  enum: [small, medium, large]
                  default: small
                replicas:
                  type: object
                  properties:
                    min: {type: integer, minimum: 1, maximum: 20, default: 1}
                    max: {type: integer, minimum: 1, maximum: 50, default: 1}
                llm:
                  type: object
                  required: [provider]
                  properties:
                    provider: {type: string, enum: [fake, openai]}
                    model: {type: string, maxLength: 100}
                    baseUrl: {type: string, pattern: "^https?://"}
                    timeoutSeconds: {type: integer, minimum: 1, maximum: 60, default: 10}
                    maxConcurrency: {type: integer, minimum: 1, maximum: 256, default: 16}
                    credentials:
                      type: object
                      description: Where the API key lives in the platform secret store (never the key itself).
                      required: [remoteKey]
                      properties:
                        remoteKey: {type: string, pattern: "^[a-zA-Z0-9/_-]+$", maxLength: 200}
                        property: {type: string, default: llm_api_key}
                documents:
                  type: object
                  properties:
                    maxBytes: {type: integer, minimum: 1000, maximum: 1000000, default: 100000}
                    ttlHours: {type: integer, minimum: 1, maximum: 720, default: 24}
                slo:
                  type: object
                  properties:
                    availabilityTarget: {type: number, minimum: 0.9, maximum: 0.9999, default: 0.995}
                    latencyTarget: {type: number, minimum: 0.5, maximum: 0.999, default: 0.95}
                    latencyThresholdSeconds:
                      type: string
                      description: Must match a request-latency histogram bucket.
                      enum: ["0.5", "1.0", "2.5", "5.0", "10.0"]
                      default: "2.5"
                    llmCostPerHourWarningUsd: {type: number, minimum: 0, default: 5}
                ingress:
                  type: object
                  properties:
                    host:
                      type: string
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                      maxLength: 253
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase: {type: string}
                observedGeneration: {type: integer}
                helmRevision: {type: integer}
                endpoint: {type: string}
                readyReplicas: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string}
