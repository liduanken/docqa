apiVersion: v1
kind: Namespace
metadata:
  name: docqa-operator
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docqa-operator
  namespace: docqa-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: docqa-operator
rules:
  - apiGroups: [platform.example.com]
    resources: [docqaservices, docqaservices/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # Everything the chart renders, plus Secrets where Helm stores release state.
  # Broad by necessity of the Helm-operator pattern; see the controller docstring.
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, prometheusrules]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: docqa-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: docqa-operator
subjects:
  - kind: ServiceAccount
    name: docqa-operator
    namespace: docqa-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docqa-operator
  namespace: docqa-operator
  labels: {app.kubernetes.io/name: docqa-operator}
spec:
  replicas: 1
  # Never two operators reconciling at once.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: docqa-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: docqa-operator}
    spec:
      serviceAccountName: docqa-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: docqa-operator:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: DOCQA_IMAGE, value: "docqa:0.1.0"}
          ports:
            - {name: health, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
