apiVersion: v1
kind: Service
metadata:
  name: {{ include "docqa.fullname" . }}
  labels:
    {{- include "docqa.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "docqa.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "docqa.fullname" . }}
  labels:
    {{- include "docqa.labels" . | nindent 4 }}
automountServiceAccountToken: false
