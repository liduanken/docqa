apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docqa.fullname" . }}
  labels:
    {{- include "docqa.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if not (hasPrefix "DOCQA_" $key) }}
  {{- fail (printf "config key %q must start with DOCQA_" $key) }}
  {{- end }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
