{{- if .Values.secrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "docqa.fullname" . }}
  labels:
    {{- include "docqa.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.secrets.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "docqa.secretName" . }}
    creationPolicy: Owner
  data:
    {{- required "secrets.externalSecret.data must be non-empty when the ExternalSecret is enabled" .Values.secrets.externalSecret.data | toYaml | nindent 4 }}
{{- end }}
